<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f5f1ea">
  <title>耄耋哈基米 Tap</title>
  <link rel="icon" href="assets/maodie-greenscreen-calm.png" type="image/png">
  <style>
    :root {
      --paper: #f5f1ea;
      --ink: #262523;
      --muted: #716c66;
      --orange: #e87922;
      --orange-dark: #a84616;
      --coral: #ef5d52;
      --teal: #159f92;
      --blue: #4775d1;
      --line: rgba(38, 37, 35, .18);
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }

    #stage { position: fixed; inset: 0; overflow: hidden; isolation: isolate; }
    #fx { position: absolute; inset: 0; z-index: 1; pointer-events: none; }

    #cat {
      position: absolute;
      inset: 0;
      z-index: 4;
      display: grid;
      place-items: center;
      pointer-events: none;
      transform-origin: 50% 64%;
      will-change: transform;
    }
    #cat-inner {
      position: relative;
      width: min(54vmin, 540px);
      aspect-ratio: 1;
      overflow: visible;
      will-change: transform, filter;
    }
    #cat-inner img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: saturate(1.07) contrast(1.04) drop-shadow(0 24px 42px rgba(38, 37, 35, .28));
    }
    #cat-hiss { opacity: 0; transition: opacity .06s linear; }
    #cat-inner.is-hissing #cat-hiss { opacity: 1; }

    #topbar {
      position: absolute;
      top: max(14px, env(safe-area-inset-top));
      left: max(14px, env(safe-area-inset-left));
      right: max(14px, env(safe-area-inset-right));
      z-index: 8;
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: none;
      transition: opacity .4s ease, transform .4s ease;
    }
    #topbar.is-hidden { opacity: 0; transform: translateY(-10px); }
    .controls { display: flex; gap: 8px; pointer-events: auto; }
    .control {
      min-width: 46px;
      min-height: 42px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      background: rgba(245, 241, 234, .92);
      font: 700 12px/1 "PingFang SC", "Microsoft YaHei", sans-serif;
      cursor: pointer;
      touch-action: manipulation;
      transition: border-color .2s ease, background .2s ease, transform .2s ease;
    }
    .control:hover { border-color: var(--orange); }
    .control:active { transform: scale(.94); }
    .control.is-muted { color: var(--coral); border-color: var(--coral); }
    .control svg { width: 18px; height: 18px; vertical-align: middle; }
    .control .slash { opacity: 0; }
    .control.is-muted .slash { opacity: 1; }
    #credit {
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .12em;
      pointer-events: none;
    }

    #flash { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
    .flash {
      position: absolute;
      border: 2px solid rgba(232, 121, 34, .34);
      border-radius: 10px;
      animation: flash .45s ease-out forwards;
    }
    @keyframes flash { from { opacity: .8; transform: scale(.98); } to { opacity: 0; transform: scale(1.03); } }

    #overlay {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      align-content: center;
      gap: 10px;
      background: rgba(245, 241, 234, .93);
      cursor: pointer;
      transition: opacity .45s ease;
    }
    #overlay.is-hidden { opacity: 0; pointer-events: none; }
    .title {
      color: var(--orange);
      font-size: clamp(38px, 10vmin, 76px);
      font-weight: 900;
      letter-spacing: .12em;
    }
    .title em { color: var(--ink); font-style: normal; }
    .hint {
      color: var(--muted);
      font-size: clamp(13px, 2.6vmin, 17px);
      letter-spacing: .34em;
      animation: breathe 1.6s ease-in-out infinite;
    }
    @keyframes breathe { 50% { opacity: .32; } }

    @media (max-width: 520px) {
      #credit { display: none; }
      .control { min-width: 42px; padding-inline: 9px; }
      .control span { display: none; }
      #cat-inner { width: min(78vmin, 460px); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="fx" aria-hidden="true"></canvas>

    <div id="topbar" class="is-hidden">
      <div class="controls" aria-label="声音控制">
        <button id="music-toggle" class="control" type="button" aria-pressed="false" title="关闭音乐">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l10-2v13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="6" cy="18" r="3" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="16" cy="16" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path class="slash" d="M4 3l16 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
          <span>音乐</span>
        </button>
        <button id="sfx-toggle" class="control" type="button" aria-pressed="false" title="关闭音效">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9v6h4l5 4V5L9 9H5zM17 9.5a4 4 0 010 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path class="slash" d="M4 3l16 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
          <span>音效</span>
        </button>
      </div>
      <div id="credit">耄耋绿幕版 · 哈基米九宫格</div>
    </div>

    <div id="flash"></div>
    <div id="cat" aria-hidden="true">
      <div id="cat-inner">
        <img id="cat-normal" src="assets/maodie-greenscreen-calm.png" alt="">
        <img id="cat-hiss" src="assets/maodie-greenscreen-hiss.png" alt="">
      </div>
    </div>

    <div id="overlay" role="button" tabindex="0" aria-label="点击开始">
      <div class="title">哈基米<em>Tap</em></div>
      <div class="hint">点击开始哈基米</div>
    </div>
  </div>
  <audio id="sample-ha" src="assets/hakimi-ha.wav" preload="auto"></audio>
  <audio id="sample-ji" src="assets/hakimi-ji.wav" preload="auto"></audio>
  <audio id="sample-mi" src="assets/hakimi-mi.wav" preload="auto"></audio>
  <script src="main.js"></script>
</body>
</html>
